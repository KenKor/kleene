# Pilot workflow for the self-hosted runners labelled `ci` (BuildServer project;
# the CI machines are currently iKendy and dell6700).
# Kept separate from ci.yml so the GitHub-hosted pipeline stays authoritative
# until this one has proven itself. Once it has, ci.yml can simply swap its
# runs-on and this file can go away.
name: CI (self-hosted)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (self-hosted)
    runs-on: [self-hosted, linux, ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No actions/setup-dotnet here: the runner host already has the .NET SDK
      # installed system-wide, and downloading a second copy into the runner
      # tool cache on every run is the main thing self-hosting is meant to avoid.
      - name: Show toolchain
        run: |
          dotnet --version
          dotnet --list-sdks

      # -m:1 keeps MSBuild in one process. iKendy runs Ubuntu's own rebuild of .NET 10
      # (dotnet-runtime-10.0 10.0.12-0ubuntu1~26.04.1), whose out-of-process MSBuild worker
      # nodes intermittently abort with "Internal CLR error. (0x80131506)": dotnet/runtime#130577,
      # open, not reproducible with Microsoft's own build. Remove it once Ubuntu ships a fixed
      # runtime or iKendy moves to Microsoft's build.
      - name: Restore
        run: dotnet restore ./kleene.sln -m:1

      - name: Build (Release)
        run: dotnet build ./kleene.sln -c Release --no-restore -m:1

      - name: Test (Release)
        run: dotnet test ./kleene.sln -c Release --no-build --verbosity normal -m:1
